  {{- range $path, $_ := .Files.Glob "dashboards/**.json" }}
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: {{ $.Release.Name }}-dash-{{ $path | base | trimSuffix ".json" }}
    labels:
      grafana_dashboard: "true"
  data:
    {{ $path | base }}: |-
      {{- $.Files.Get $path | nindent 4 }}
  ---
  {{- end }}